name: Test Ryzen C6 Fix Script

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: Check Script Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true

  test-systems:
    name: Test Script Logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bash Code Syntax
        run: |
          bash -n fix-ryzen.sh

      - name: Test Systemd Detection
        run: |
          docker run --rm -v ${{ github.workspace }}:/app ubuntu:latest bash -c "
            apt-get update && apt-get install -y bash
            bash -n /app/fix-ryzen.sh
          "

      - name: Test OpenRC Detection
        run: |
          docker run --rm -v ${{ github.workspace }}:/app alpine:latest sh -c "
            apk add --no-cache bash
            bash -n /app/fix-ryzen.sh
          "
