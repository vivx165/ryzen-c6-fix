name: Test Ryzen C6 Fix Script

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: Check Script Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        continue-on-error: true

  test-systems:
    name: Test Init Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Systemd Environment (Ubuntu)
        run: |
          docker run --rm -v ${{ github.workspace }}:/app ubuntu:latest bash -c "
            apt-get update && apt-get install -y git python3 systemd sudo
            mkdir -p /home/testuser
            SUDO_USER=testuser bash -n /app/fix-ryzen.sh
          "

      - name: Test Runit Environment (Void Linux)
        run: |
          docker run --rm -v ${{ github.workspace }}:/app voidlinux/voidlinux bash -c "
            xbps-install -Sy git python3 sudo
            mkdir -p /home/testuser
            SUDO_USER=testuser bash -n /app/fix-ryzen.sh
          "

      - name: Test OpenRC Environment (Alpine)
        run: |
          docker run --rm -v ${{ github.workspace }}:/app alpine:latest sh -c "
            apk add --no-cache bash git python3 openrc sudo
            mkdir -p /home/testuser
            SUDO_USER=testuser bash -n /app/fix-ryzen.sh
          "
