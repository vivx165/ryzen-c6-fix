#!/bin/bash
set -e

CURRENT_USER="${SUDO_USER:-$USER}"
TARGET_DIR="/home/$CURRENT_USER/ZenStates-Linux"

if [ ! -d "$TARGET_DIR" ]; then
    git clone https://github.com/r4m0n/ZenStates-Linux "$TARGET_DIR"
    chown -R "$CURRENT_USER:$CURRENT_USER" "$TARGET_DIR"
fi

sudo modprobe msr

if command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]; then
    cat << EOF | sudo tee /etc/systemd/system/disable-c6.service > /dev/null
[Unit]
Description=Disable Ryzen C6 State
After=multi-user.target

[Service]
Type=oneshot
ExecStart=/usr/bin/python3 $TARGET_DIR/zenstates.py --c6-disable
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOF
    sudo systemctl daemon-reload
    sudo systemctl enable --now disable-c6.service

elif [ -d /etc/sv ]; then
    sudo mkdir -p /etc/sv/disable-c6
    cat << EOF | sudo tee /etc/sv/disable-c6/run > /dev/null
#!/bin/sh
modprobe msr
exec /usr/bin/python3 $TARGET_DIR/zenstates.py --c6-disable
EOF
    sudo chmod +x /etc/sv/disable-c6/run
    sudo ln -sf /etc/sv/disable-c6 /var/service/

elif command -v rc-update >/dev/null 2>&1; then
    cat << EOF | sudo tee /etc/init.d/disable-c6 > /dev/null
#!/sbin/openrc-run
description="Disable Ryzen C6 State"
command="/usr/bin/python3"
command_args="$TARGET_DIR/zenstates.py --c6-disable"

depend() {
    after modules
}
start_pre() {
    modprobe msr
}
EOF
    sudo chmod +x /etc/init.d/disable-c6
    sudo rc-update add disable-c6 default
    sudo rc-service disable-c6 start

else
    if [ ! -f /etc/rc.local ]; then
        echo -e "#!/bin/sh\nexit 0" | sudo tee /etc/rc.local > /dev/null
        sudo chmod +x /etc/rc.local
    fi
    
    sudo sed -i '/exit 0/i modprobe msr' /etc/rc.local
    sudo sed -i "/exit 0/i /usr/bin/python3 $TARGET_DIR/zenstates.py --c6-disable" /etc/rc.local
fi

echo "Done! C6 state disabled successfully for $CURRENT_USER"
